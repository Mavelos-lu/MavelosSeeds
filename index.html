<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#009688" />
  <title>Mavelos – SeedListeStock</title>
  <style>
    :root {
      --primary: #009688;
      --primary-dark: #00796B;
      --primary-light: #E0F2F1;
      --primary-border: #B2DFDB;
      --bg: #F5F7F7;
      --surface: #FFFFFF;
      --text: #1E293B;
      --text-muted: #64748B;
      --border: #E2E8F0;
      --success-bg: #E8F5E9;
      --success-text: #2E7D32;
      --danger-bg: #FFEBEE;
      --danger-text: #C62828;
      --radius: 14px;
      --shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 18px;
    }

    .header-inner {
      max-width: 1360px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand img {
      height: 44px;
      width: auto;
      object-fit: contain;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text);
      margin: 0;
      letter-spacing: -0.01em;
    }

    .brand-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary);
      display: inline-block;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 42px;
      padding: 0 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .icon-btn:active {
      transform: scale(0.98);
    }

    .icon-btn.active {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary-dark);
    }

    .icon-btn.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #FFFFFF;
    }

    .badge-count {
      background: var(--primary);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 999px;
    }

    /* Filter Panel */
    .filter-panel {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 18px 16px;
    }

    .filter-panel.hidden {
      display: none;
    }

    .filter-inner {
      max-width: 1360px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .filter-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
      gap: 10px;
      align-items: end;
    }

    .filter-row-top {
      display: grid;
      grid-template-columns: 2fr 1.2fr auto auto;
      gap: 10px;
      align-items: center;
    }

    @media (max-width: 820px) {
      .filter-row-top {
        grid-template-columns: 1fr 1fr;
      }
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field label {
      font-size: 0.73rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.92rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s, background-color 0.15s;
    }

    input:focus,
    select:focus {
      border-color: var(--primary);
      background: #FFFFFF;
    }

    .toggle-pill {
      height: 42px;
      padding: 0 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap;
      user-select: none;
    }

    .toggle-pill.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #FFFFFF;
    }

    .reset-btn {
      height: 42px;
      padding: 0 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #FFFFFF;
      color: var(--text-muted);
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .reset-btn:hover {
      border-color: var(--text-muted);
      color: var(--text);
    }

    /* Flavor Tags Bar */
    .flavor-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-top: 4px;
      border-top: 1px dashed var(--border);
    }

    .flavor-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .flavor-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .flavor-chip {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
    }

    .flavor-chip.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #FFFFFF;
      font-weight: 600;
    }

    /* Main Content */
    main {
      max-width: 1360px;
      margin: 0 auto;
      padding: 18px;
    }

    .results-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .results-bar strong {
      color: var(--text);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    /* Strain Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .card:hover {
      border-color: var(--primary-border);
      transform: translateY(-2px);
    }

    .card-media {
      position: relative;
      height: 170px;
      background: linear-gradient(135deg, #E0F2F1 0%, #F1F5F9 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .card-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-badges {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      gap: 6px;
      pointer-events: none;
    }

    .badge {
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      backdrop-filter: blur(6px);
    }

    .badge-typ {
      background: rgba(0, 150, 136, 0.92);
      color: #FFFFFF;
    }

    .badge-dom {
      background: rgba(255, 255, 255, 0.92);
      color: var(--text);
      border: 1px solid rgba(0, 0, 0, 0.06);
    }

    .card-body {
      padding: 14px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .card-brand {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--primary-dark);
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
      margin: 2px 0 0;
      line-height: 1.3;
    }

    /* Ratio Bar */
    .ratio-wrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .ratio-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.74rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .ratio-bar {
      height: 6px;
      border-radius: 999px;
      background: #E2E8F0;
      overflow: hidden;
      display: flex;
    }

    .ratio-indica {
      background: var(--primary);
      height: 100%;
    }

    .ratio-sativa {
      background: #80CBC4;
      height: 100%;
    }

    /* Specs Grid */
    .specs {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 7px;
    }

    .spec-box {
      background: var(--bg);
      border-radius: 9px;
      padding: 7px 10px;
      display: flex;
      flex-direction: column;
    }

    .spec-label {
      font-size: 0.69rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }

    .spec-val {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text);
    }

    /* Card Flavors */
    .card-flavors {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .mini-tag {
      font-size: 0.74rem;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--primary-light);
      color: var(--primary-dark);
      font-weight: 600;
    }

    /* Card Footer */
    .card-footer {
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .price {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text);
    }

    .price small {
      font-size: 0.76rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .stock-pill {
      font-size: 0.76rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
    }

    .stock-in {
      background: var(--success-bg);
      color: var(--success-text);
    }

    .stock-out {
      background: var(--danger-bg);
      color: var(--danger-text);
    }

    /* Empty / Loading States */
    .state-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 42px 20px;
      text-align: center;
      color: var(--text-muted);
    }

    /* Detail Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: var(--surface);
      border-radius: 18px;
      max-width: 560px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    }

    .modal-media {
      position: relative;
      height: 230px;
      background: var(--primary-light);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.94);
      color: var(--text);
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .modal-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="brand">
        <img
          src="https://www.mavelos.lu/wp-content/uploads/2023/04/Mavelos_CBD-LUX-Luxembourg_Cannabis_logo_Transparent_margin-261x300.png"
          alt="Mavelos Logo"
        />
        <div>
          <h1 class="brand-title">SeedListeStock</h1>
          <div class="brand-sub">
            <span class="status-dot"></span>
            <span id="statusText">Verbinde mit Google Sheets…</span>
          </div>
        </div>
      </div>

      <div class="header-actions">
        <button type="button" class="icon-btn active" id="toggleFilterBtn" title="Filter ein-/ausblenden">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
          </svg>
          <span>Filter</span>
          <span class="badge-count" id="activeFilterCount" style="display:none;">0</span>
        </button>

        <button type="button" class="icon-btn primary" id="reloadBtn" title="Daten aus Google Sheets neu laden">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
          <span>Aktualisieren</span>
        </button>
      </div>
    </div>
  </header>

  <section class="filter-panel" id="filterPanel">
    <div class="filter-inner">
      <div class="filter-row-top">
        <div class="field">
          <label for="searchInput">Suche</label>
          <input type="text" id="searchInput" placeholder="Strain, Marke oder Geschmack suchen…" />
        </div>

        <div class="field">
          <label for="sortSelect">Sortierung</label>
          <select id="sortSelect">
            <option value="default">Standard (Tabelle)</option>
            <option value="price-asc">Preis: Niedrig → Hoch</option>
            <option value="price-desc">Preis: Hoch → Niedrig</option>
            <option value="thc-desc">THC: Hoch → Niedrig</option>
            <option value="thc-asc">THC: Niedrig → Hoch</option>
            <option value="stock-desc">Bestand: Hoch → Niedrig</option>
            <option value="name-asc">Name: A → Z</option>
          </select>
        </div>

        <div class="field">
          <label>&nbsp;</label>
          <button type="button" class="toggle-pill" id="stockToggle">
            <span>Nur auf Lager</span>
          </button>
        </div>

        <div class="field">
          <label>&nbsp;</label>
          <button type="button" class="reset-btn" id="resetBtn">Zurücksetzen</button>
        </div>
      </div>

      <div class="filter-row">
        <div class="field">
          <label for="typSelect">Typ</label>
          <select id="typSelect">
            <option value="ALL">Alle Typen</option>
          </select>
        </div>

        <div class="field">
          <label for="dominanzSelect">Dominanz</label>
          <select id="dominanzSelect">
            <option value="ALL">Alle Dominanzen</option>
          </select>
        </div>

        <div class="field">
          <label for="markeSelect">Marke</label>
          <select id="markeSelect">
            <option value="ALL">Alle Marken</option>
          </select>
        </div>

        <div class="field">
          <label for="zeitraumSelect">Zeitraum</label>
          <select id="zeitraumSelect">
            <option value="ALL">Alle Zeiträume</option>
          </select>
        </div>

        <div class="field">
          <label for="seedmengeSelect">Seedmenge</label>
          <select id="seedmengeSelect">
            <option value="ALL">Alle Mengen</option>
          </select>
        </div>

        <div class="field">
          <label for="thcInput">THC ab (%)</label>
          <input type="number" id="thcInput" min="0" max="100" step="0.1" placeholder="z. B. 20" />
        </div>

        <div class="field">
          <label for="priceInput">Preis max (€)</label>
          <input type="number" id="priceInput" min="0" step="0.5" placeholder="z. B. 40" />
        </div>
      </div>

      <div class="flavor-section" id="flavorSection" style="display:none;">
        <div class="flavor-header">
          <span>Geschmack (UND-Filter – mehrere auswählbar)</span>
          <span id="selectedFlavorInfo"></span>
        </div>
        <div class="flavor-tags" id="flavorTags"></div>
      </div>
    </div>
  </section>

  <main>
    <div class="results-bar">
      <div><strong id="visibleCount">0</strong> von <span id="totalCount">0</span> Sorten angezeigt</div>
      <div id="activeSummary"></div>
    </div>

    <div id="cardsContainer" class="grid"></div>
  </main>

  <div class="modal-backdrop" id="detailModal">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-media" id="modalMedia"></div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR-CFrZC-h66xhN85F3ndPWKQPDpi5-AjbXN9_DqtUwjlVJ16Lgqk876YmeHxa0H6X7FwzFDMPdtG9_/pub?output=csv";

    let allStrains = [];

    const state = {
      search: "",
      sort: "default",
      inStockOnly: false,
      typ: "ALL",
      dominanz: "ALL",
      marke: "ALL",
      zeitraum: "ALL",
      seedmenge: "ALL",
      minThc: "",
      maxPrice: "",
      flavors: new Set(),
      filtersVisible: true
    };

    const el = {
      statusText: document.getElementById("statusText"),
      toggleFilterBtn: document.getElementById("toggleFilterBtn"),
      activeFilterCount: document.getElementById("activeFilterCount"),
      filterPanel: document.getElementById("filterPanel"),
      reloadBtn: document.getElementById("reloadBtn"),
      searchInput: document.getElementById("searchInput"),
      sortSelect: document.getElementById("sortSelect"),
      stockToggle: document.getElementById("stockToggle"),
      resetBtn: document.getElementById("resetBtn"),
      typSelect: document.getElementById("typSelect"),
      dominanzSelect: document.getElementById("dominanzSelect"),
      markeSelect: document.getElementById("markeSelect"),
      zeitraumSelect: document.getElementById("zeitraumSelect"),
      seedmengeSelect: document.getElementById("seedmengeSelect"),
      thcInput: document.getElementById("thcInput"),
      priceInput: document.getElementById("priceInput"),
      flavorSection: document.getElementById("flavorSection"),
      flavorTags: document.getElementById("flavorTags"),
      selectedFlavorInfo: document.getElementById("selectedFlavorInfo"),
      visibleCount: document.getElementById("visibleCount"),
      totalCount: document.getElementById("totalCount"),
      activeSummary: document.getElementById("activeSummary"),
      cardsContainer: document.getElementById("cardsContainer"),
      detailModal: document.getElementById("detailModal"),
      modalMedia: document.getElementById("modalMedia"),
      modalBody: document.getElementById("modalBody")
    };

    // RFC-4180 CSV Parser (supports quoted newlines & commas)
    function parseCSV(text) {
      const rows = [];
      let row = [];
      let cell = "";
      let inQuotes = false;

      const cleanText = text.replace(/^\uFEFF/, "");

      for (let i = 0; i < cleanText.length; i++) {
        const ch = cleanText[i];
        const next = cleanText[i + 1];

        if (inQuotes) {
          if (ch === '"' && next === '"') {
            cell += '"';
            i++;
          } else if (ch === '"') {
            inQuotes = false;
          } else {
            cell += ch;
          }
        } else {
          if (ch === '"') {
            inQuotes = true;
          } else if (ch === ",") {
            row.push(cell.trim());
            cell = "";
          } else if (ch === "\r" && next === "\n") {
            row.push(cell.trim());
            rows.push(row);
            row = [];
            cell = "";
            i++;
          } else if (ch === "\n" || ch === "\r") {
            row.push(cell.trim());
            rows.push(row);
            row = [];
            cell = "";
          } else {
            cell += ch;
          }
        }
      }

      if (cell.length > 0 || row.length > 0) {
        row.push(cell.trim());
        rows.push(row);
      }

      return rows;
    }

    function parseNumber(val) {
      if (val === null || val === undefined) return null;
      const cleaned = String(val).replace(/[^\d,.-]/g, "").replace(",", ".");
      if (!cleaned) return null;
      const num = parseFloat(cleaned);
      return Number.isFinite(num) ? num : null;
    }

    function cleanStr(val) {
      if (val === null || val === undefined) return "";
      return String(val).replace(/\s+/g, " ").trim();
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function normalizeRows(rows) {
      if (!rows || rows.length < 2) return [];

      const headers = rows[0].map((h) => cleanStr(h).toLowerCase());
      const idx = (names) => {
        for (const n of names) {
          const i = headers.indexOf(n);
          if (i !== -1) return i;
        }
        return -1;
      };

      const col = {
        marke: idx(["marke"]),
        strainname: idx(["strainname", "strain", "name"]),
        typ: idx(["typ"]),
        dominanz: idx(["dominanz"]),
        indica: idx(["indica in %", "indica"]),
        sativa: idx(["sativa in %", "sativa"]),
        thc: idx(["thc"]),
        cbd: idx(["cbd"]),
        zeitraum: idx(["zeitraum"]),
        seedmenge: idx(["seedmenge", "menge", "seeds"]),
        preis: idx(["preis"]),
        stock: idx(["stock", "bestand"]),
        g1: idx(["geschmack 1", "geschmack1"]),
        g2: idx(["geschmack 2", "geschmack2"]),
        g3: idx(["geschmack 3", "geschmack3"]),
        bildlink: idx(["bildlink", "bild", "bild_url"])
      };

      const items = [];

      for (let r = 1; r < rows.length; r++) {
        const line = rows[r];
        if (!line || line.every((c) => !cleanStr(c))) continue;

        const get = (i) => (i >= 0 && i < line.length ? cleanStr(line[i]) : "");

        const strainname = get(col.strainname);
        const marke = get(col.marke);
        if (!strainname && !marke) continue;

        const typ = get(col.typ);
        const dominanz = get(col.dominanz);
        const indicaRaw = get(col.indica);
        const sativaRaw = get(col.sativa);
        const thcRaw = get(col.thc);
        const cbdRaw = get(col.cbd);
        const zeitraum = get(col.zeitraum);
        const seedmenge = get(col.seedmenge);
        const preisRaw = get(col.preis);
        const stockRaw = get(col.stock);
        const bildlink = get(col.bildlink);

        const flavors = [get(col.g1), get(col.g2), get(col.g3)].filter(Boolean);
        const flavorsLower = flavors.map((f) => f.toLowerCase());

        items.push({
          index: r,
          marke,
          strainname,
          typ,
          dominanz,
          indicaRaw,
          indicaNum: parseNumber(indicaRaw),
          sativaRaw,
          sativaNum: parseNumber(sativaRaw),
          thcRaw,
          thcNum: parseNumber(thcRaw),
          cbdRaw,
          cbdNum: parseNumber(cbdRaw),
          zeitraum,
          seedmenge,
          seedmengeNum: parseNumber(seedmenge),
          preisRaw,
          preisNum: parseNumber(preisRaw),
          stockRaw,
          stockNum: parseNumber(stockRaw),
          flavors,
          flavorsLower,
          bildlink
        });
      }

      return items;
    }

    function populateSelect(selectEl, values, defaultLabel, formatter = (v) => v) {
      const current = selectEl.value;
      selectEl.innerHTML = `<option value="ALL">${escapeHtml(defaultLabel)}</option>`;
      values.forEach((val) => {
        const opt = document.createElement("option");
        opt.value = val;
        opt.textContent = formatter(val);
        selectEl.appendChild(opt);
      });
      if ([...selectEl.options].some((o) => o.value === current)) {
        selectEl.value = current;
      } else {
        selectEl.value = "ALL";
      }
    }

    function buildFilterOptions() {
      const uniqueSorted = (arr, numeric = false) => {
        const set = new Set(arr.filter(Boolean));
        return [...set].sort((a, b) =>
          numeric
            ? a.localeCompare(b, "de", { numeric: true, sensitivity: "base" })
            : a.localeCompare(b, "de", { sensitivity: "base" })
        );
      };

      populateSelect(
        el.typSelect,
        uniqueSorted(allStrains.map((s) => s.typ)),
        "Alle Typen"
      );

      populateSelect(
        el.dominanzSelect,
        uniqueSorted(allStrains.map((s) => s.dominanz)),
        "Alle Dominanzen"
      );

      populateSelect(
        el.markeSelect,
        uniqueSorted(allStrains.map((s) => s.marke)),
        "Alle Marken"
      );

      populateSelect(
        el.zeitraumSelect,
        uniqueSorted(allStrains.map((s) => s.zeitraum), true),
        "Alle Zeiträume",
        (v) => `${v} Tage`
      );

      populateSelect(
        el.seedmengeSelect,
        uniqueSorted(allStrains.map((s) => s.seedmenge), true),
        "Alle Mengen",
        (v) => `${v} Seeds`
      );

      // Build unique flavor tags across Geschmack 1, 2, 3
      const flavorMap = new Map();
      allStrains.forEach((s) => {
        s.flavors.forEach((f) => {
          const key = f.toLowerCase();
          if (!flavorMap.has(key)) {
            flavorMap.set(key, f);
          }
        });
      });

      const sortedFlavors = [...flavorMap.entries()].sort((a, b) =>
        a[1].localeCompare(b[1], "de", { sensitivity: "base" })
      );

      if (sortedFlavors.length > 0) {
        el.flavorSection.style.display = "flex";
        el.flavorTags.innerHTML = "";
        sortedFlavors.forEach(([key, label]) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "flavor-chip" + (state.flavors.has(key) ? " active" : "");
          btn.textContent = label;
          btn.addEventListener("click", () => {
            if (state.flavors.has(key)) {
              state.flavors.delete(key);
            } else {
              state.flavors.add(key);
            }
            btn.classList.toggle("active");
            render();
          });
          el.flavorTags.appendChild(btn);
        });
      } else {
        el.flavorSection.style.display = "none";
      }
    }

    function getFilteredStrains() {
      const searchTokens = state.search
        .toLowerCase()
        .split(/\s+/)
        .filter(Boolean);
      const minThc = parseNumber(state.minThc);
      const maxPrice = parseNumber(state.maxPrice);

      const filtered = allStrains.filter((item) => {
        // 1. Stock toggle
        if (state.inStockOnly) {
          if (item.stockNum === null || item.stockNum <= 0) return false;
        }

        // 2. Typ (AND)
        if (state.typ !== "ALL") {
          if (item.typ.toLowerCase() !== state.typ.toLowerCase()) return false;
        }

        // 3. Dominanz (AND)
        if (state.dominanz !== "ALL") {
          if (item.dominanz.toLowerCase() !== state.dominanz.toLowerCase()) return false;
        }

        // 4. Marke (AND)
        if (state.marke !== "ALL") {
          if (item.marke.toLowerCase() !== state.marke.toLowerCase()) return false;
        }

        // 5. Zeitraum dropdown (AND)
        if (state.zeitraum !== "ALL") {
          if (item.zeitraum !== state.zeitraum) return false;
        }

        // 6. Seedmenge dropdown (AND)
        if (state.seedmenge !== "ALL") {
          if (item.seedmenge !== state.seedmenge) return false;
        }

        // 7. Min THC (AND)
        if (minThc !== null) {
          if (item.thcNum === null || item.thcNum < minThc) return false;
        }

        // 8. Max Price (AND)
        if (maxPrice !== null) {
          if (item.preisNum === null || item.preisNum > maxPrice) return false;
        }

        // 9. Flavors (Strict AND across all selected flavor tags)
        if (state.flavors.size > 0) {
          for (const reqFlavor of state.flavors) {
            if (!item.flavorsLower.includes(reqFlavor)) return false;
          }
        }

        // 10. Search tokens (AND)
        if (searchTokens.length > 0) {
          const haystack = [
            item.strainname,
            item.marke,
            item.typ,
            item.dominanz,
            item.zeitraum,
            ...item.flavors
          ]
            .join(" ")
            .toLowerCase();

          for (const token of searchTokens) {
            if (!haystack.includes(token)) return false;
          }
        }

        return true;
      });

      // Sorting
      const sorted = [...filtered];
      switch (state.sort) {
        case "price-asc":
          sorted.sort((a, b) => (a.preisNum ?? 999999) - (b.preisNum ?? 999999));
          break;
        case "price-desc":
          sorted.sort((a, b) => (b.preisNum ?? -1) - (a.preisNum ?? -1));
          break;
        case "thc-desc":
          sorted.sort((a, b) => (b.thcNum ?? -1) - (a.thcNum ?? -1));
          break;
        case "thc-asc":
          sorted.sort((a, b) => (a.thcNum ?? 999999) - (b.thcNum ?? 999999));
          break;
        case "stock-desc":
          sorted.sort((a, b) => (b.stockNum ?? -1) - (a.stockNum ?? -1));
          break;
        case "name-asc":
          sorted.sort((a, b) => a.strainname.localeCompare(b.strainname, "de"));
          break;
        default:
          sorted.sort((a, b) => a.index - b.index);
      }

      return sorted;
    }

    function updateActiveFilterBadge() {
      let count = 0;
      if (state.search) count++;
      if (state.inStockOnly) count++;
      if (state.typ !== "ALL") count++;
      if (state.dominanz !== "ALL") count++;
      if (state.marke !== "ALL") count++;
      if (state.zeitraum !== "ALL") count++;
      if (state.seedmenge !== "ALL") count++;
      if (state.minThc !== "") count++;
      if (state.maxPrice !== "") count++;
      count += state.flavors.size;

      if (count > 0) {
        el.activeFilterCount.style.display = "inline-block";
        el.activeFilterCount.textContent = String(count);
        el.activeSummary.textContent = `${count} Filter aktiv (UND)`;
      } else {
        el.activeFilterCount.style.display = "none";
        el.activeSummary.textContent = "";
      }

      el.selectedFlavorInfo.textContent =
        state.flavors.size > 0 ? `${state.flavors.size} ausgewählt` : "";
    }

    function placeholderSvg() {
      return `<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#009688" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.55">
        <path d="M12 2C9 7 4 9 4 14a8 8 0 0 0 16 0c0-5-5-7-8-12z"></path>
        <path d="M12 14v8"></path>
      </svg>`;
    }

   function renderMediaHtml(item) {
      if (!item.bildlink) return placeholderSvg();
      return `<img src="${escapeHtml(item.bildlink)}" alt="${escapeHtml(item.strainname)}" referrerpolicy="no-referrer" onerror="this.outerHTML = placeholderSvg()" />`;
    }

    function render() {
      updateActiveFilterBadge();
      const list = getFilteredStrains();

      el.totalCount.textContent = String(allStrains.length);
      el.visibleCount.textContent = String(list.length);

      if (list.length === 0) {
        el.cardsContainer.innerHTML = `
          <div class="state-box" style="grid-column: 1 / -1;">
            <strong>Keine passenden Sorten gefunden.</strong><br/>
            Passe deine Filter an oder tippe auf „Zurücksetzen“.
          </div>
        `;
        return;
      }

      el.cardsContainer.innerHTML = "";

      list.forEach((item) => {
        const card = document.createElement("article");
        card.className = "card";

        // Badges
        const badges = [];
        if (item.typ) badges.push(`<span class="badge badge-typ">${escapeHtml(item.typ)}</span>`);
        if (item.dominanz) badges.push(`<span class="badge badge-dom">${escapeHtml(item.dominanz)}</span>`);

        // Ratio bar (only if Indica or Sativa present)
        let ratioHtml = "";
        if (item.indicaNum !== null || item.sativaNum !== null) {
          const ind = item.indicaNum ?? (item.sativaNum !== null ? Math.max(0, 100 - item.sativaNum) : 0);
          const sat = item.sativaNum ?? (item.indicaNum !== null ? Math.max(0, 100 - item.indicaNum) : 0);
          ratioHtml = `
            <div class="ratio-wrap">
              <div class="ratio-labels">
                <span>Indica ${escapeHtml(item.indicaRaw || ind)}%</span>
                <span>Sativa ${escapeHtml(item.sativaRaw || sat)}%</span>
              </div>
              <div class="ratio-bar">
                <div class="ratio-indica" style="width:${Math.min(100, Math.max(0, ind))}%"></div>
                <div class="ratio-sativa" style="width:${Math.min(100, Math.max(0, sat))}%"></div>
              </div>
            </div>
          `;
        }

        // Specs (skip empty values)
        const specs = [];
        if (item.thcRaw) {
          specs.push(`<div class="spec-box"><span class="spec-label">THC</span><span class="spec-val">${escapeHtml(item.thcRaw)} %</span></div>`);
        }
        if (item.cbdRaw) {
          specs.push(`<div class="spec-box"><span class="spec-label">CBD</span><span class="spec-val">${escapeHtml(item.cbdRaw)} %</span></div>`);
        }
        if (item.zeitraum) {
          specs.push(`<div class="spec-box"><span class="spec-label">Zeitraum</span><span class="spec-val">${escapeHtml(item.zeitraum)} Tage</span></div>`);
        }
        if (item.seedmenge) {
          specs.push(`<div class="spec-box"><span class="spec-label">Seedmenge</span><span class="spec-val">${escapeHtml(item.seedmenge)} Seeds</span></div>`);
        }

        const specsHtml = specs.length > 0 ? `<div class="specs">${specs.join("")}</div>` : "";

        // Flavors (skip empty)
        const flavorsHtml =
          item.flavors.length > 0
            ? `<div class="card-flavors">${item.flavors
                .map((f) => `<span class="mini-tag">${escapeHtml(f)}</span>`)
                .join("")}</div>`
            : "";

        // Footer (Price & Stock, skip if empty)
        const priceHtml = item.preisRaw
          ? `<div class="price">${escapeHtml(item.preisRaw)} €${item.seedmenge ? ` <small>/ ${escapeHtml(item.seedmenge)} Seeds</small>` : ""}</div>`
          : `<div></div>`;

        let stockHtml = "";
        if (item.stockNum !== null) {
          stockHtml =
            item.stockNum > 0
              ? `<span class="stock-pill stock-in">${escapeHtml(item.stockRaw)} auf Lager</span>`
              : `<span class="stock-pill stock-out">Ausverkauft</span>`;
        }

        const footerHtml =
          item.preisRaw || item.stockNum !== null
            ? `<div class="card-footer">${priceHtml}${stockHtml}</div>`
            : "";

        card.innerHTML = `
          <div class="card-media">
            ${renderMediaHtml(item)}
            ${badges.length ? `<div class="card-badges">${badges.join("")}</div>` : ""}
          </div>
          <div class="card-body">
            <div>
              ${item.marke ? `<div class="card-brand">${escapeHtml(item.marke)}</div>` : ""}
              <h2 class="card-title">${escapeHtml(item.strainname)}</h2>
            </div>
            ${ratioHtml}
            ${specsHtml}
            ${flavorsHtml}
            ${footerHtml}
          </div>
        `;

        card.addEventListener("click", () => openModal(item));
        el.cardsContainer.appendChild(card);
      });
    }

    function openModal(item) {
      el.modalMedia.innerHTML = `
        ${renderMediaHtml(item)}
        <button type="button" class="modal-close" id="closeModalBtn" aria-label="Schließen">✕</button>
      `;

      const rows = [
        ["Marke", item.marke],
        ["Typ", item.typ],
        ["Dominanz", item.dominanz],
        ["Indica / Sativa", item.indicaRaw || item.sativaRaw ? `${item.indicaRaw || "-"}% / ${item.sativaRaw || "-"}%` : ""],
        ["THC", item.thcRaw ? `${item.thcRaw} %` : ""],
        ["CBD", item.cbdRaw ? `${item.cbdRaw} %` : ""],
        ["Zeitraum", item.zeitraum ? `${item.zeitraum} Tage` : ""],
        ["Seedmenge", item.seedmenge ? `${item.seedmenge} Seeds` : ""],
        ["Preis", item.preisRaw ? `${item.preisRaw} €` : ""],
        ["Bestand (Stock)", item.stockRaw ? `${item.stockRaw} Stück` : ""]
      ].filter(([, val]) => Boolean(val));

      const flavorsHtml =
        item.flavors.length > 0
          ? `<div class="card-flavors">${item.flavors
              .map((f) => `<span class="mini-tag">${escapeHtml(f)}</span>`)
              .join("")}</div>`
          : "";

      el.modalBody.innerHTML = `
        <div>
          ${item.marke ? `<div class="card-brand">${escapeHtml(item.marke)}</div>` : ""}
          <h2 class="card-title" style="font-size:1.3rem;">${escapeHtml(item.strainname)}</h2>
        </div>
        ${flavorsHtml}
        <div class="modal-grid">
          ${rows
            .map(
              ([label, val]) => `
            <div class="spec-box">
              <span class="spec-label">${escapeHtml(label)}</span>
              <span class="spec-val">${escapeHtml(val)}</span>
            </div>`
            )
            .join("")}
        </div>
      `;

      el.detailModal.classList.add("open");
      document.getElementById("closeModalBtn").addEventListener("click", closeModal);
    }

    function closeModal() {
      el.detailModal.classList.remove("open");
    }

    async function loadData() {
      el.statusText.textContent = "Lade Tabelle…";
      el.reloadBtn.disabled = true;

      try {
        const cacheBuster = `${CSV_URL}&t=${Date.now()}`;
        const res = await fetch(cacheBuster);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();
        const rows = parseCSV(text);
        allStrains = normalizeRows(rows);

        buildFilterOptions();
        render();

        const now = new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
        el.statusText.textContent = `Live • Stand ${now} Uhr`;
      } catch (err) {
        el.statusText.textContent = "Fehler beim Laden";
        el.cardsContainer.innerHTML = `
          <div class="state-box" style="grid-column: 1 / -1;">
            <strong>Tabelle konnte nicht geladen werden.</strong><br/>
            Prüfe die WLAN-Verbindung und tippe oben auf „Aktualisieren“.
          </div>
        `;
      } finally {
        el.reloadBtn.disabled = false;
      }
    }

    // Event Listeners
    el.toggleFilterBtn.addEventListener("click", () => {
      state.filtersVisible = !state.filtersVisible;
      el.filterPanel.classList.toggle("hidden", !state.filtersVisible);
      el.toggleFilterBtn.classList.toggle("active", state.filtersVisible);
    });

    el.reloadBtn.addEventListener("click", loadData);

    el.searchInput.addEventListener("input", (e) => {
      state.search = e.target.value;
      render();
    });

    el.sortSelect.addEventListener("change", (e) => {
      state.sort = e.target.value;
      render();
    });

    el.stockToggle.addEventListener("click", () => {
      state.inStockOnly = !state.inStockOnly;
      el.stockToggle.classList.toggle("active", state.inStockOnly);
      render();
    });

    el.typSelect.addEventListener("change", (e) => {
      state.typ = e.target.value;
      render();
    });

    el.dominanzSelect.addEventListener("change", (e) => {
      state.dominanz = e.target.value;
      render();
    });

    el.markeSelect.addEventListener("change", (e) => {
      state.marke = e.target.value;
      render();
    });

    el.zeitraumSelect.addEventListener("change", (e) => {
      state.zeitraum = e.target.value;
      render();
    });

    el.seedmengeSelect.addEventListener("change", (e) => {
      state.seedmenge = e.target.value;
      render();
    });

    el.thcInput.addEventListener("input", (e) => {
      state.minThc = e.target.value;
      render();
    });

    el.priceInput.addEventListener("input", (e) => {
      state.maxPrice = e.target.value;
      render();
    });

    el.resetBtn.addEventListener("click", () => {
      state.search = "";
      state.sort = "default";
      state.inStockOnly = false;
      state.typ = "ALL";
      state.dominanz = "ALL";
      state.marke = "ALL";
      state.zeitraum = "ALL";
      state.seedmenge = "ALL";
      state.minThc = "";
      state.maxPrice = "";
      state.flavors.clear();

      el.searchInput.value = "";
      el.sortSelect.value = "default";
      el.stockToggle.classList.remove("active");
      el.typSelect.value = "ALL";
      el.dominanzSelect.value = "ALL";
      el.markeSelect.value = "ALL";
      el.zeitraumSelect.value = "ALL";
      el.seedmengeSelect.value = "ALL";
      el.thcInput.value = "";
      el.priceInput.value = "";

      document.querySelectorAll(".flavor-chip").forEach((chip) => chip.classList.remove("active"));
      render();
    });

    el.detailModal.addEventListener("click", (e) => {
      if (e.target === el.detailModal) closeModal();
    });

    loadData();
  </script>
</body>
</html>
