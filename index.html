<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#009688" />
  <title>Mavelos – SeedListeStock</title>
  <style>
    :root {
      --primary: #009688;
      --primary-dark: #00796B;
      --primary-light: #E0F2F1;
      --primary-border: #B2DFDB;
      --bg: #F5F7F7;
      --surface: #FFFFFF;
      --text: #1E293B;
      --text-muted: #64748B;
      --border: #E2E8F0;
      --success-bg: #E8F5E9;
      --success-text: #2E7D32;
      --danger-bg: #FFEBEE;
      --danger-text: #C62828;
      --radius: 14px;
      --shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 18px;
    }

    .header-inner {
      max-width: 1360px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand img {
      height: 44px;
      width: auto;
      object-fit: contain;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text);
      margin: 0;
      letter-spacing: -0.01em;
    }

    .brand-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary);
      display: inline-block;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 42px;
      padding: 0 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .icon-btn:active {
      transform: scale(0.98);
    }

    .icon-btn.active {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary-dark);
    }

    .icon-btn.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #FFFFFF;
    }

    .badge-count {
      background: var(--primary);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 999px;
    }

    /* Filter Panel */
    .filter-panel {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 18px 16px;
    }

    .filter-panel.hidden {
      display: none;
    }

    .filter-inner {
      max-width: 1360px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .filter-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
      gap: 10px;
      align-items: end;
    }

    .filter-row-top {
      display: grid;
      grid-template-columns: 2fr 1.2fr auto auto;
      gap: 10px;
      align-items: center;
    }

    @media (max-width: 820px) {
      .filter-row-top {
        grid-template-columns: 1fr 1fr;
      }
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field label {
      font-size: 0.73rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.92rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s, background-color 0.15s;
    }

    input:focus,
    select:focus {
      border-color: var(--primary);
      background: #FFFFFF;
    }

    .toggle-pill {
      height: 42px;
      padding: 0 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap;
      user-select: none;
    }

    .toggle-pill.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #FFFFFF;
    }

    .reset-btn {
      height: 42px;
      padding: 0 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #FFFFFF;
      color: var(--text-muted);
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .reset-btn:hover {
      border-color: var(--text-muted);
      color: var(--text);
    }

    /* Flavor Tags Bar */
    .flavor-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-top: 4px;
      border-top: 1px dashed var(--border);
    }

    .flavor-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .flavor-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .flavor-chip {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
    }

    .flavor-chip.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #FFFFFF;
      font-weight: 600;
    }

    /* Main Content */
    main {
      max-width: 1360px;
      margin: 0 auto;
      padding: 18px;
    }

    .results-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .results-bar strong {
      color: var(--text);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    /* Strain Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .card:hover {
      border-color: var(--primary-border);
      transform: translateY(-2px);
    }

    .card-media {
      position: relative;
      height: 170px;
      background: linear-gradient(135deg, #E0F2F1 0%, #F1F5F9 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

      width: 1
